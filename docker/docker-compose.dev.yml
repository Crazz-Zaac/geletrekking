# Local development only. NOT loaded automatically.
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile tools up -d
# Ports bind to 127.0.0.1 so they are never exposed on a public interface
# (Docker's port publishing bypasses UFW).
services:
  frontend:
    ports:
      - "127.0.0.1:3000:3000"

  backend:
    ports:
      - "127.0.0.1:5000:5000"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  mongo:
    ports:
      - "127.0.0.1:27017:27017"

  mongo-express:
    ports:
      - "127.0.0.1:8081:8081"
